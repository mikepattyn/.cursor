name: umbrella

services:
  example-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: umbrella-example-app:local
    ports:
      - "4200:4200"
    volumes:
      - ..:/workspace
      - example-app-node-modules:/workspace/node_modules
      - example-app-app-node-modules:/workspace/apps/frontend/angular/example-app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
      API_PROXY_TARGET: http://example-api:3000
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    depends_on:
      example-api:
        condition: service_healthy

  example-api:
    build:
      context: ../apps/backend/dotnet/example-api
      dockerfile: Dockerfile
    image: umbrella-example-api:local
    ports:
      - "3000:3000"
    volumes:
      - calculator-sqlite:/data
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:3000
      SQLITE_PATH: /data/calculator.db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  example-app-node-modules:
  example-app-app-node-modules:
  calculator-sqlite:
