name: umbrella

services:
  example-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: umbrella-example-app:local
    ports:
      - "4200:4200"
    volumes:
      - ..:/workspace
      - example-app-node-modules:/workspace/node_modules
      - example-app-app-node-modules:/workspace/apps/frontend/__FRAMEWORK__/example-app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
      BFF_PROXY_TARGET: http://example-bff:3000
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    depends_on:
      example-bff:
        condition: service_healthy

  example-bff:
    build:
      context: __BFF_CONTEXT__
      dockerfile: __BFF_DOCKERFILE__
    image: umbrella-example-bff:local
    ports:
      - "3000:3000"
    environment:
      CALCULATOR_URL: http://example-calculator:8081
    healthcheck:
      test: __BFF_HEALTHCHECK__
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      example-calculator:
        condition: service_healthy

  example-calculator:
    build:
      context: __MS_CONTEXT__
      dockerfile: __MS_DOCKERFILE__
    image: umbrella-example-calculator:local
    ports:
      - "8081:8081"
    volumes:
      - calculator-sqlite:/data
    environment:
      SQLITE_PATH: /data/calculator.db
    healthcheck:
      test: __MS_HEALTHCHECK__
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  example-app-node-modules:
  example-app-app-node-modules:
  calculator-sqlite:
