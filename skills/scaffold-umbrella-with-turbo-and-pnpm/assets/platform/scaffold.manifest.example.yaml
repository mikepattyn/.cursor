version: 1
umbrella: umbrella
topology: angular-dotnet
mode: generate
phases:
  inputs: done
  context-map: pending
selected:
  - typescript-calculator
  - typescript-calculator-client
  - openapi-calculator
  - angular-ui
  - angular-app
  - dotnet-api
identifiers:
  folder: umbrella
  npmScope: "@umbrella"
  dockerProject: umbrella
  dotnetNamespace: Umbrella
ports:
  web: 4200
  api: 3000
commands:
  check: pnpm exec turbo run build test lint typecheck format:check
  test: pnpm exec turbo run test
  typecheck: pnpm exec turbo run typecheck
  format:check: pnpm exec turbo run format:check
  contract:test: pnpm --filter @umbrella/calculator-api test
  dev:web: pnpm --filter @umbrella/example-app dev
  dev:full: docker compose -f docker/docker-compose.yml up --build
native:
  dotnet-api: dotnet test apps/backend/dotnet/example-api/ExampleApi.sln
deployment:
  web: static
  api: container
publishable: false
versioning: independent
